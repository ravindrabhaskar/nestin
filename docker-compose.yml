services:
  nestin:
    build: .
    image: nestin/app:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      TRUST_PROXY: "false"
      DATABASE_PATH: /data/nestin.db
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-NestIn@2026}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (>= 32 random characters) in your .env}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@nestin.io}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Set SUPER_ADMIN_PASSWORD in your .env}
      SUPER_ADMIN_ACCESS_CODE: ${SUPER_ADMIN_ACCESS_CODE:?Set SUPER_ADMIN_ACCESS_CODE in your .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - nestin-data:/data
    restart: unless-stopped

volumes:
  nestin-data:
